[package]
name = "volta-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
cuda = ["volta-accel/cuda", "volta-gpt2/cuda", "volta-proto/cuda", "volta-pcs/cuda"]
c6-trace = ["volta-mac/c6-trace", "volta-proto/c6-trace", "volta-pcs/c6-trace"]
c61-p3-authenticated-reference = ["volta-pcs/c61-p3-authenticated-reference"]

[dependencies]
libc = { workspace = true }
volta-accel = { workspace = true }
volta-field = { workspace = true }
volta-gpt2 = { workspace = true }
volta-mac = { workspace = true }
volta-pcg = { workspace = true }
volta-proto = { workspace = true }
volta-pcs = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bin]]
name = "c6_t1_census_record"
path = "src/bin/c6_t1_census_record.rs"
required-features = ["c6-trace"]

[[bin]]
name = "c62_setup_bundle_record"
path = "src/bin/c62_setup_bundle_record.rs"
required-features = ["c6-trace"]

[[bin]]
name = "c62_setup_bundle_measure"
path = "src/bin/c62_setup_bundle_measure.rs"
required-features = ["c6-trace", "c61-p3-authenticated-reference"]

[[bench]]
name = "p1_mac_epilogue"
harness = false
